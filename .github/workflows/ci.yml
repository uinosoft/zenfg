name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'ci-main-pages') || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node ./scripts/assemble-pages.mjs
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm install --global npm@11.11.0
      - run: npm --version
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.98.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --all-features --doc
      - run: cargo check --workspace --all-features --examples
      - run: cargo run -p zenfg --example minimal-frame --all-features
      - run: cargo run -p zenfg --example snapshot-export --features snapshot
      - run: cargo run -p zenfg-snapshot --example basic
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: npm run cargo:package-check

  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm --version
      - run: npm ci
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: rustup default 1.98.0
      - run: npm run test:cross-language
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-conformance
          path: .test-dist/cross-language
          if-no-files-found: ignore

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [typescript, rust, cross-language]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

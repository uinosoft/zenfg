name: Checks
on:
  workflow_call:
    inputs:
      release_build:
        type: boolean
        default: false
      pages_artifact:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: ${{ !inputs.release_build && 'npm' || '' }}
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm run docs:test
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:test:browser
      - run: npm run pack:check
      - if: inputs.pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm --version
      - run: npm ci
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.98.0
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo check --locked --workspace --all-features --examples
      - run: cargo run --locked -p zenfg --example minimal-frame --all-features
      - run: cargo run --locked -p zenfg --example snapshot-export --features snapshot
      - run: cargo run --locked -p zenfg-snapshot --example basic
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: npm run cargo:package-check

  cross-language:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: ${{ !inputs.release_build && 'npm' || '' }}
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm --version
      - run: npm ci
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: rustup default 1.98.0
      - run: npm run test:cross-language
      - run: npm run release:smoke
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: cross-language-conformance
          path: .test-dist/cross-language
          if-no-files-found: ignore

  release-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm run release:check
      - run: npm run release:test
      - run: npm run release:assess -- --summary
      - name: Create artifact contract fixture
        run: |
          mkdir -p target/artifact-contract
          echo "zenfg artifact contract" > target/artifact-contract/probe.txt
      - id: contract-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-contract
          path: target/artifact-contract/
          archive: true
          retention-days: 1
          if-no-files-found: error
      - name: Download artifact by name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact-contract
          path: target/artifact-by-name/
          digest-mismatch: error
      - name: Download artifact by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.contract-upload.outputs.artifact-id }}
          path: target/artifact-by-id/
          digest-mismatch: error
      - name: Verify both downloaded artifacts
        run: |
          cmp target/artifact-contract/probe.txt target/artifact-by-name/probe.txt
          cmp target/artifact-contract/probe.txt target/artifact-by-id/probe.txt

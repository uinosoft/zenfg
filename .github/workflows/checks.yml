name: Checks
on:
  workflow_call:
    inputs:
      release_build:
        type: boolean
        default: false
      pages_artifact:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Resolve pnpm cache paths
        if: ${{ !inputs.release_build }}
        id: pnpm-cache
        shell: bash
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency sources
        if: ${{ !inputs.release_build }}
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ steps.pnpm-cache.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.node-version') }}
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run docs:check
      - run: pnpm run docs:test
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run docs:test:browser
      - run: pnpm run pack:check
      - name: Save trusted dependency sources
        if: ${{ success() && !inputs.release_build && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ steps.pnpm-cache.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.node-version') }}
      - if: inputs.pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Resolve pnpm cache paths
        if: ${{ !inputs.release_build }}
        id: pnpm-cache
        shell: bash
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency sources
        if: ${{ !inputs.release_build }}
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ steps.pnpm-cache.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.node-version') }}
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.98.0
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo check --locked --workspace --all-features --examples
      - run: cargo run --locked -p zenfg --example minimal-frame --all-features
      - run: cargo run --locked -p zenfg --example resource-pool-control --all-features
      - run: cargo run --locked -p zenfg --example snapshot-export --features snapshot
      - run: cargo run --locked -p zenfg-snapshot --example basic
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: pnpm run cargo:package-check

  cross-language:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Resolve pnpm cache paths
        if: ${{ !inputs.release_build }}
        id: pnpm-cache
        shell: bash
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency sources
        if: ${{ !inputs.release_build }}
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ steps.pnpm-cache.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.node-version') }}
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: rustup default 1.98.0
      - run: pnpm run test:cross-language
      - run: pnpm run release:smoke
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: true
          name: cross-language-conformance
          path: .test-dist/cross-language
          if-no-files-found: ignore

  release-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Resolve pnpm cache paths
        if: ${{ !inputs.release_build }}
        id: pnpm-cache
        shell: bash
        run: |
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path --silent)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - name: Restore dependency sources
        if: ${{ !inputs.release_build }}
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ steps.pnpm-cache.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.node-version') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:check
      - run: pnpm run release:test
      - run: pnpm run release:assess --summary
      - name: Create artifact contract fixture
        run: |
          mkdir -p target/artifact-contract
          echo "zenfg artifact contract" > target/artifact-contract/probe.txt
      - id: contract-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-contract
          path: target/artifact-contract/
          archive: true
          retention-days: 1
          if-no-files-found: error
      - name: Download artifact by name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact-contract
          path: target/artifact-by-name/
          digest-mismatch: error
      - name: Download artifact by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.contract-upload.outputs.artifact-id }}
          path: target/artifact-by-id/
          digest-mismatch: error
      - name: Verify both downloaded artifacts
        run: |
          cmp target/artifact-contract/probe.txt target/artifact-by-name/probe.txt
          cmp target/artifact-contract/probe.txt target/artifact-by-id/probe.txt

name: Checks
on:
  workflow_call:
    inputs:
      release_build:
        type: boolean
        default: false
      pages_artifact:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: ${{ !inputs.release_build && 'npm' || '' }}
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run docs:check
      - run: npm run docs:test
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:test:browser
      - run: npm run pack:check
      - if: inputs.pages_artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/site/dist

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm --version
      - run: npm ci
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.98.0
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo check --locked --workspace --all-features --examples
      - run: cargo run --locked -p zenfg --example minimal-frame --all-features
      - run: cargo run --locked -p zenfg --example snapshot-export --features snapshot
      - run: cargo run --locked -p zenfg-snapshot --example basic
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: npm run cargo:package-check

  cross-language:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: ${{ !inputs.release_build && 'npm' || '' }}
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm --version
      - run: npm ci
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: rustup default 1.98.0
      - run: npm run test:cross-language
      - run: npm run release:smoke
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-language-conformance
          path: .test-dist/cross-language
          if-no-files-found: ignore

  release-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm run release:check
      - run: npm run release:test

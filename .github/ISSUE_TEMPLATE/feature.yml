name: Feature request
description: Describe a concrete use case or improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Explain the workflow and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired result and any relevant ownership or integration constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you tried.
    validations:
      required: false

[workspace]
resolver = "3"
members = [
    "crates/zenfg",
    "crates/zenfg-snapshot",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/uinosoft/zenfg"
homepage = "https://uinosoft.github.io/zenfg/"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = "30.0.1"
